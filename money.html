<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小白论坛夏季活动</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: '微软雅黑', sans-serif;
        }

        body {
            background: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            background: white;
            padding: 40px 60px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-width: 800px;
        }

        .logo {
            width: 120px;
            margin-bottom: 20px;
        }

        .title {
            color: #2c3e50;
            font-size: 2.2em;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-join {
            display: inline-block;
            padding: 12px 35px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-join:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .footer {
            margin-top: 30px;
            color: #bdc3c7;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="http://shuixian.ltd/a?WpnMElGKLmtYCK" alt="活动logo" class="logo">
        <h2 >小白论坛绿宝石活动</h2>
<p> </p>
        <p class="subtitle">
         <br>   发视频，赢绿宝石活动<br>
            <br>500播放量:20个绿宝石<br>1000播放量:50个绿宝石<br>2000播放量:120个绿宝石<br>5000播放量:320个绿宝石<br>10000播放量:1000个绿宝石<br>15000播放量:5000个绿宝石<br>20000播放量:50000个绿宝石<br>(不封顶)
        </p>
        <a href="https://docs.qq.com/form/page/DWmprTUZnZnp6VG9a#ohd" class="btn-join">立即报名 ></a>
        <div class="footer">
            活动时间：2025年7月5日-2025年9月5日
        </div>
    </div>
</body>
</html>
